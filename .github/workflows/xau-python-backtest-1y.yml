name: XAU Python Backtest 1Y

on:
  push:
    branches:
      - chatgpt/python-xau-backtest-1y
    paths:
      - "research_xau/**"
      - ".github/workflows/xau-python-backtest-1y.yml"
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.24" "pandas>=2.0" pyarrow

      - name: Fetch archived Dukascopy XAUUSD tick months
        run: |
          rm -rf data/ticks_repo
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/simom1/XAUUSD-history.git data/ticks_repo
          cd data/ticks_repo
          git sparse-checkout init --no-cone
          git sparse-checkout set \
            2025/xauusd_2025_07.parquet \
            2025/xauusd_2025_08.parquet \
            2025/xauusd_2025_09.parquet \
            2025/xauusd_2025_10_early.parquet \
            2025/xauusd_2025_10_mid.parquet \
            2025/xauusd_2025_10_late.parquet \
            2025/xauusd_2025_11.parquet \
            2025/xauusd_2025_12.parquet \
            2026/xauusd_2026_01_early.parquet \
            2026/xauusd_2026_01_mid.parquet \
            2026/xauusd_2026_01_late.parquet \
            2026/xauusd_2026_02.parquet \
            2026/xauusd_2026_03_early.parquet \
            2026/xauusd_2026_03_mid.parquet \
            2026/xauusd_2026_03_late.parquet \
            2026/xauusd_2026_04.parquet \
            2026/xauusd_2026_05.parquet \
            2026/xauusd_2026_06.parquet \
            2026/xauusd_2026_07.parquet \
            2026/xauusd_2026_08.parquet
          git checkout main
          find 2025 2026 -type f -name '*.parquet' -printf "%p %s bytes\n"

      - name: Build common M1/M5/M15/H1/H4/D1 bars
        run: python research_xau/prepare_ticks.py

      - name: Run UT, Volume Profile and ICT screens
        run: python research_xau/run_screen.py

      - name: Clone and prepare Quant research engine
        run: |
          mkdir -p external
          git clone --depth 1 https://github.com/Aarayanc49/xauusd-quant-backtest.git external/xauusd-quant-backtest
          pip install -r external/xauusd-quant-backtest/requirements.txt
          cd external/xauusd-quant-backtest
          python -m research.fetch csv ../../data/quant_csv

      - name: Run Quant SWING screen
        run: python research_xau/run_quant.py

      - name: Print all screening results
        if: always()
        run: |
          echo "===== DETERMINISTIC ====="
          cat results/deterministic_summary.json 2>/dev/null || true
          echo ""
          echo "===== QUANT ====="
          cat results/quant_summary.json 2>/dev/null || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xau-python-backtest-1y-results
          path: |
            results/
            data/processed/xauusd_m5.csv
            data/processed/xauusd_m15.csv
          if-no-files-found: warn
